aid: agrospheres
name: AgroSpheres
description: 'AgroSpheres is an agricultural biotechnology company based in Charlottesville,
  Virginia, founded by University of Virginia researchers, that develops bio-based
  crop protection products built on its AgriCell bioparticle platform. The company
  uses a single-step fermentation process that produces and biodegradably encapsulates
  biological actives all at once, giving added stability and a tunable release profile
  for targeted, non-toxic pest and disease control intended to be safe for pollinators,
  people and soil. Its first commercial product, the broad-spectrum biofungicide
  FUN-THYME, is marketed through an exclusive partnership with Wilbur-Ellis and was
  approved in California in 2026. AgroSpheres manufactures at a biomanufacturing
  facility in Charlottesville. It is a physical agricultural-inputs business and
  publishes no developer program, public API, or machine-readable API artifacts.'
